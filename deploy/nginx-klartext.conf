# /etc/nginx/sites-available/klartext.celox.io
#
# Statische Auslieferung von app/dist. Kein Backend — Modus B (Relay) kommt in
# Phase 4 und bekommt dann einen eigenen /api/-Block auf 127.0.0.1:4264.
#
# ⚠️ KEIN Umami und kein sub_filter. Das ist Absicht und keine Vergesslichkeit:
#    klartext sagt zu, keine Analyse-Werkzeuge zu laden. Wer den zentralen
#    Rollout (/opt/umami/rollout.py) laufen laesst, muss diese Domain auslassen.

server {
    server_name klartext.celox.io;

    root /var/www/klartext.celox.io;
    index index.html;

    # ---------------------------------------------------------------- Sicherheit
    #
    # 'wasm-unsafe-eval' ist ausschliesslich fuer Argon2 da: OpenPGP.js leitet
    # die Vault-Passphrase in einem WASM-Modul ab. Das ist NICHT 'unsafe-eval',
    # sondern die enge Direktive nur fuer WebAssembly-Kompilierung.
    #
    # 'require-trusted-types-for' zwingt die App, kein innerHTML zu benutzen.
    # Der Worker-Start braucht dafuer eine Richtlinie — 'trusted-types' laesst
    # genau diese eine zu (siehe app/src/crypto/client.ts).
    set $klartext_csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types klartext-worker";

    add_header Content-Security-Policy $klartext_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # ⚠️ camera=() ist Absicht: derzeit nutzt nichts die Kamera. Phase 3 bringt
    #    das Abscannen von QR-Codes zur Fingerprint-Pruefung — DANN muss hier
    #    camera=(self) stehen, sonst scheitert getUserMedia ohne erkennbaren Grund.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), midi=(), serial=(), bluetooth=(), interest-cohort=()" always;

    # ------------------------------------------------------------------ Inhalte

    # Dateinamen tragen einen Inhalts-Hash — ein Jahr unveraenderlich.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy $klartext_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ Ein add_header in einem location-Block wirft ALLE geerbten Header weg.
    #    try_files leitet intern hierher um, also muessen sie hier vollstaendig
    #    wiederholt werden — sonst faehrt die Startseite ohne CSP aus.
    location = /index.html {
        # Ungehashter Name: nie ausliefern lassen, ohne neu zu fragen. Sonst
        # haelt der heuristische Browser-Cache nach einem Deploy stundenlang
        # das alte Bundle fest.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $klartext_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), midi=(), serial=(), bluetooth=(), interest-cohort=()" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # --------------------------------------------------------------------- TLS
    # certbot traegt hier listen/ssl_certificate ein (certonly --nginx).
}
