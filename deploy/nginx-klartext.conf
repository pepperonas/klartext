# /etc/nginx/sites-available/klartext.celox.io
#
# Statische Auslieferung von app/dist plus der Zustellserver unter /relay/.
#
# ⚠️ Der Zustellserver MUSS unter derselben Herkunft liegen. Die CSP der App
#    erlaubt `connect-src 'self'`; ein Server auf einem anderen Host wird vom
#    Browser abgelehnt, bevor eine Anfrage hinausgeht. Das ist Absicht — so kann
#    klartext strukturell mit niemandem sonst sprechen.
#
# ⚠️ KEIN Umami und kein sub_filter. Das ist Absicht und keine Vergesslichkeit:
#    klartext sagt zu, keine Analyse-Werkzeuge zu laden. Wer den zentralen
#    Rollout (/opt/umami/rollout.py) laufen laesst, muss diese Domain auslassen.

server {
    server_name klartext.celox.io;

    root /var/www/klartext.celox.io;
    index index.html;

    # ---------------------------------------------------------------- Sicherheit
    #
    # 'wasm-unsafe-eval' ist ausschliesslich fuer Argon2 da: OpenPGP.js leitet
    # die Vault-Passphrase in einem WASM-Modul ab. Das ist NICHT 'unsafe-eval',
    # sondern die enge Direktive nur fuer WebAssembly-Kompilierung.
    #
    # 'require-trusted-types-for' zwingt die App, kein innerHTML zu benutzen.
    # Der Worker-Start braucht dafuer eine Richtlinie — 'trusted-types' laesst
    # genau diese eine zu (siehe app/src/crypto/client.ts).
    set $klartext_csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types klartext-worker";

    add_header Content-Security-Policy $klartext_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # camera=(self) seit Phase 3: das Abscannen eines QR-Codes zur
    # Fingerprint-Pruefung braucht sie. Das Bild verlaesst das Geraet nicht und
    # wird nirgends gespeichert; die Kamera laeuft nur, solange der Scan-Bereich
    # offen ist. Alles Uebrige bleibt zu.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), midi=(), serial=(), bluetooth=(), interest-cohort=()" always;

    # ------------------------------------------------------------------ Inhalte

    # Dateinamen tragen einen Inhalts-Hash — ein Jahr unveraenderlich.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy $klartext_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ------------------------------------------------------- Zustellserver
    #
    # Modus B, systemd-Dienst auf 127.0.0.1:4265.
    location /relay/ {
        proxy_pass http://127.0.0.1:4265/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ⚠️ KEIN X-Real-IP, KEIN X-Forwarded-For. Der Zustellserver soll die
        #    Adresse des Absenders gar nicht erst sehen — er drosselt dann eben
        #    über die Adresse des Proxys. Eine IP, die nie ankommt, kann auch
        #    nicht versehentlich protokolliert werden.
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ Long-Polling: der Server hält die Antwort bis zu 25 s zurück.
        #    Ohne dieses Zeitlimit bricht nginx die Verbindung vorher ab.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # `proxy_buffering off` braucht es NICHT — es ist eine gewöhnliche
        # Antwort, kein Datenstrom. Genau deshalb Long-Polling statt SSE.

        # Kein Zugriffsprotokoll: der halbe Zweck des Dienstes ist, keine
        # Metadaten zu hinterlassen.
        access_log off;

        add_header Content-Security-Policy $klartext_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ Ein add_header in einem location-Block wirft ALLE geerbten Header weg.
    #    try_files leitet intern hierher um, also muessen sie hier vollstaendig
    #    wiederholt werden — sonst faehrt die Startseite ohne CSP aus.
    location = /index.html {
        # Ungehashter Name: nie ausliefern lassen, ohne neu zu fragen. Sonst
        # haelt der heuristische Browser-Cache nach einem Deploy stundenlang
        # das alte Bundle fest.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $klartext_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), midi=(), serial=(), bluetooth=(), interest-cohort=()" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # --------------------------------------------------------------------- TLS
    #
    # ⚠️ Diese Zeilen stehen bewusst IM REPO und nicht nur auf dem Server.
    #    Zuerst standen sie nur dort (von `certbot --nginx` eingetragen), und
    #    ein `scp` dieser Datei hat sie geloescht: der vhost horchte danach nur
    #    noch auf Port 80, HTTPS fiel auf den Standard-Server durch und der
    #    Browser zeigte ein Zertifikat fuer eine voellig fremde Domain
    #    (ERR_CERT_COMMON_NAME_INVALID). Ein Deploy darf TLS nicht abraeumen
    #    koennen — also gehoert die Wahrheit hierher.
    #
    # ⚠️ `listen 443 ssl http2;` in dieser Schreibweise: nginx 1.24 auf diesem
    #    Server kennt `http2 on;` noch nicht.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/klartext.celox.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klartext.celox.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Klartext-HTTP gibt es nur, um sofort auf TLS zu verweisen.
server {
    listen 80;
    listen [::]:80;
    server_name klartext.celox.io;

    # Die ACME-Anfrage muss durch, sonst laesst sich das Zertifikat nicht
    # erneuern. Sie steht VOR der Weiterleitung, sonst verschluckt die sie.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
