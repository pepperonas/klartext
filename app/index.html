<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>klartext — PGP im Browser</title>
    <meta
      name="description"
      content="PGP-Werkzeug für den Browser. Der private Schlüssel bleibt auf diesem Gerät."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <!-- ⚠️ `crossorigin` ist bei Schriften auch bei gleicher Herkunft Pflicht:
         Schriften werden immer im CORS-Modus geholt. Ohne das Attribut lädt der
         Browser die Datei ZWEIMAL — einmal für den Vorabruf, einmal für
         @font-face — und der Vorabruf war umsonst. -->
    <link rel="preload" href="/schriften/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/schriften/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1113" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="klartext" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="sprungmarke" href="#haupt">Zum Inhalt springen</a>
    <div id="app"></div>
    <noscript>
      klartext rechnet vollständig in deinem Browser. Ohne JavaScript kann es das nicht — es gibt
      keinen Server, der die Arbeit übernehmen würde.
    </noscript>
  </body>
</html>
