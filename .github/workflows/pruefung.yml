name: Prüfung

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      # `npm ci` schlägt fehl, wenn package-lock.json und package.json
      # auseinanderlaufen — das ist der Lockfile-Check.
      - run: npm ci

      - name: Abhängigkeiten prüfen
        run: npm audit --audit-level=high

      - run: npm run lint
      - run: npm run typecheck

      - name: gpg-Version festhalten
        run: gpg --version | head -1

      # KLARTEXT_GPG=1 lässt die Interop-Tests NICHT still überspringen, wenn
      # gpg fehlt — sie schlagen dann fehl. Eine grün-blinde Suite wäre
      # schlimmer als eine rote.
      - name: Tests
        run: npm test
        env:
          KLARTEXT_GPG: '1'

      - run: npm run build

      # Erst nach dem Bauen: dieser Lauf schließt die Prüfung des fertigen
      # Bundles ein (openpgp darf nur im Worker-Chunk stecken).
      - name: Bundle-Prüfung
        run: npm test
        env:
          KLARTEXT_GPG: '1'
          KLARTEXT_DIST: '1'

      - name: Browser holen
        run: npx playwright install --with-deps chromium

      - name: Nichts verlässt den Browser
        run: npm run e2e

      # Kein Zustand ohne Ausweg, kein Knopf ohne Wirkung. Dieser Lauf hat
      # schon zwei Attrappen gefunden, die keine andere Prüfung sah.
      - name: Wegfindung
        run: npm run wege

      # Verschlüsseln ohne eigenen Schlüssel — gegengeprüft mit echtem gpg.
      - name: Erster Nutzen
        run: npm run erster-nutzen

      # Phase 2 gilt als erfüllt, wenn die App im Flugmodus arbeitet.
      - name: Offline-Betrieb
        run: npm run offline

      # Liest die selbst erzeugten QR-Codes mit Chromes Decoder zurück.
      - name: QR-Codes
        run: npm run qr

      - name: Zugänglichkeit
        run: npm run a11y

      # Zwei echte Browser gegen ein gebautes Relay: Zustellung, Signatur und
      # der Nachweis, dass in der Datenbank kein Klartext liegt.
      - name: Zustellung über das Relay
        run: npm run relay

  reproduzierbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci

      # Zweimal bauen und vergleichen. Wer den Build-Hash im UI nachrechnen
      # können soll, braucht einen Bau, der zweimal dasselbe ergibt.
      #
      # ⚠️ Das lief hier früher als handgeschriebene sha256sum-Kette neben dem
      #    Werkzeug her — zwei Umsetzungen derselben Aussage, von denen eine
      #    unbemerkt veralten kann. Jetzt läuft dasselbe Werkzeug, das auch
      #    lokal läuft; es vergleicht zusätzlich den Gesamt-Hash und meldet
      #    Dateien, die nur in einem der beiden Läufe auftauchen.
      - name: Zweimal bauen und vergleichen
        run: npm run reproduzierbar
